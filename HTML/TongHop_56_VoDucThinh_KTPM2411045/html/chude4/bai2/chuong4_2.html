<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Đăng ký</title>
<link rel="stylesheet" href="chuong4_2.css">
</head>

<body>

<div class="register-box">

<div class="header">
ĐĂNG KÝ
<span class="close">×</span>
</div>

<form>

<div class="row">
<div class="col">
<label>Họ:</label>
<input type="text">
</div>

<div class="col">
<label>Tên</label>
<input type="text">
</div>
</div>

<label>Chọn giới tính:</label>

<div class="gender">
<input type="radio" name="gt"> Nam
<input type="radio" name="gt"> Nữ
</div>

<label>Email:</label>

<div class="email-box">
<input type="text" placeholder="Nhập Email">
<div class="domain">@muasamonline.com.vn</div>
</div>

<label>Mật khẩu:</label>
<input type="password" placeholder="Nhập mật khẩu">

<label>Quê quán:</label>
<select>
<option>Chọn quê quán</option>
<option>Cần Thơ</option>
<option>Hà Nội</option>
<option>TP HCM</option>
</select>

<label>Hình đại diện:</label>
<input type="file">

<div class="agree">
<input type="checkbox">
Tôi đồng ý chính sách của website
</div>

<button class="btn">Đăng ký</button>

</form>

</div>

</body>
</html>
